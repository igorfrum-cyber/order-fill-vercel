syntax = "proto3";

package orderfill.calculation.v1;

option go_package = "order-fill/backend/proto/gen/go/orderfill/calculation/v1;calculationv1";

import "orderfill/common/v1/common.proto";

service CalculationService {
  rpc CalculateOrderRecommendations(CalculateOrderRecommendationsRequest) returns (CalculateOrderRecommendationsResponse);
  rpc CalculateAdjustedQuantity(CalculateAdjustedQuantityRequest) returns (CalculateAdjustedQuantityResponse);
  rpc CalculateNorthPlan(CalculateNorthPlanRequest) returns (CalculateNorthPlanResponse);
  rpc RecalculateNorthRow(RecalculateNorthRowRequest) returns (RecalculateNorthRowResponse);
  rpc ValidateManualEdits(ValidateManualEditsRequest) returns (ValidateManualEditsResponse);
  rpc PlanBudget(PlanBudgetRequest) returns (PlanBudgetResponse);
  rpc CalculateWarehouseTransfer(CalculateWarehouseTransferRequest) returns (CalculateWarehouseTransferResponse);
}

message OrderRow {
  string id = 1;
  string article = 2;
  string name = 3;
  double revenue = 4;
  double stock = 5;
  double in_transit = 6;
  repeated double monthly_sales = 7;
  double recommended_qty = 8;
  string abc_category = 9;
  double target_stock = 10;
  double revenue_percent = 11;
  double cumulative_percent = 12;
  double average_monthly = 13;
  double total_quantity = 14;
  double warehouse_stock = 15;
  double warehouse_transit = 16;
  bool has_warehouse_stock = 17;
  double box_size = 18;
  bool has_box_size = 19;
}

message CalculateOrderRecommendationsRequest {
  orderfill.common.v1.RequestMeta meta = 1;
  string brand = 2;
  repeated OrderRow rows = 3;
  double delivery_weeks = 4;
  string city_rule = 5;
}

message CalculateOrderRecommendationsResponse {
  repeated OrderRow rows = 1;
}

message CalculateAdjustedQuantityRequest {
  string brand = 1;
  double recommended_qty = 2;
  double ordered_fact = 3;
  bool has_ordered_fact = 4;
  string box_size = 5;
  string adjustment = 6;
  int32 quantity_multiple = 7;
  string adjustment_comment = 8;
  bool allow_small_positive_order = 9;
}

message CalculateAdjustedQuantityResponse {
  double qty = 1;
  int32 rounded = 2;
  string auto_comment = 3;
  bool box_adjusted = 4;
  bool inserted = 5;
}

message NorthCityNeed {
  string city = 1;
  string article = 2;
  double qty = 3;
}

message NorthPlanRow {
  string article = 1;
  string name = 2;
  double tyumen_qty = 3;
  double transfer_qty = 4;
  double supplier_qty = 5;
  string comment = 6;
  string variant = 7;
  double tyumen_stock = 8;
  double tyumen_transit = 9;
  double tyumen_target = 10;
  double unit_size = 11;
  double novacutan_min = 12;
  double box_size = 13;
  bool has_box_size = 14;
  double warehouse_stock = 15;
  double warehouse_transit = 16;
  bool has_warehouse_stock = 17;
}

message CalculateNorthPlanRequest {
  orderfill.common.v1.RequestMeta meta = 1;
  string brand = 2;
  repeated NorthCityNeed needs = 3;
  repeated OrderRow tyumen_stock = 4;
}

message CalculateNorthPlanResponse {
  repeated NorthPlanRow rows = 1;
}

message RecalculateNorthRowRequest {
  string brand = 1;
  NorthPlanRow row = 2;
  double edited_qty = 3;
}

message RecalculateNorthRowResponse {
  NorthPlanRow row = 1;
}

message ManualEdit {
  string row_id = 1;
  double qty = 2;
  string comment = 3;
}

message ValidateManualEditsRequest {
  repeated ManualEdit edits = 1;
  repeated OrderRow rows = 2;
}

message ValidateManualEditsResponse {
  bool ok = 1;
  repeated string blocking_row_ids = 2;
}

// ChristinaLine is the PROFF product line a budget row belongs to. required is
// the full article list from the blank, so the planner can tell whether a line
// is complete.
message ChristinaLine {
  string id = 1;
  string name = 2;
  string article = 3;
  repeated string required = 4;
}

message BudgetRow {
  string key = 1;
  string name = 2;
  string category = 3;
  double quantity = 4;
  double price = 5;
  double demand = 6;
  double delivery = 7;
  double stock = 8;
  double transit = 9;
  double outbound = 10;
  double unit = 11;
  double step = 12;
  double minimum = 13;
  bool locked = 14;
  bool excluded = 15;
  bool unsafe = 16;
  // group is the blank type; only "proff" rows earn the CHRISTINA set discount.
  string group = 17;
  // line is the PROFF line membership; unset for HOME and other brands.
  ChristinaLine line = 18;
  // base_price is the blank price BEFORE the main discount. The service applies
  // PlanBudgetRequest.discount and brand order rules, so the caller sends raw
  // report numbers. price/unit/step/minimum/delivery are computed server-side
  // and ignored on input.
  double base_price = 19;
  // box_size is the blank box/multiple hint for brand order rules.
  double box_size = 20;
}

message PlanBudgetRequest {
  repeated BudgetRow rows = 1;
  double target = 2;
  bool allow_over_six = 3;
  bool allow_below_one = 4;
  // brand selects order-quantity rules (multiples, boxes, novacutan minimums).
  string brand = 5;
  // discount is the main discount percent applied to base_price (0..99.99).
  double discount = 6;
  // delivery_weeks feeds coverage: delivery months = delivery_weeks * 0.25.
  double delivery_weeks = 7;
}

message PlannedBudgetRow {
  string key = 1;
  string name = 2;
  double before = 3;
  double quantity = 4;
  string comment = 5;
  string category = 6;
}

// PlannedLineStep is one accepted CHRISTINA PROFF set-completion step (rubles).
message PlannedLineStep {
  string id = 1;
  string name = 2;
  int32 sets = 3;
  double added = 4;
  double saved = 5;
}

// PlannedLineGroup is the final per-line PROFF state for the preview (rubles).
message PlannedLineGroup {
  string id = 1;
  string name = 2;
  bool valid = 3;
  int32 sets = 4;
  double saving = 5;
  double net = 6;
}

message PlanBudgetResponse {
  repeated PlannedBudgetRow rows = 1;
  double before = 2;
  double total = 3;
  double target = 4;
  string reason = 5;
  bool complete = 6;
  repeated PlannedLineStep line_steps = 7;
  repeated PlannedLineGroup line_groups = 8;
}

message CalculateWarehouseTransferRequest {
  double office_stock = 1;
  double warehouse_stock = 2;
}

message CalculateWarehouseTransferResponse {
  double quantity = 1;
  double target = 2;
}
