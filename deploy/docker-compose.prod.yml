# Production overlay: per-service mTLS, Postgres SSL, MinIO TLS, no host-published data ports.
# Used by make https / scripts/deploy.sh when APP_ENV=production.
# Leaves come from scripts/gen-internal-tls.sh. Each container gets only its own key;
# deploy/secrets/grpc/ca.key stays on the host.

x-mtls-env: &mtls-env
  GRPC_TLS_MODE: mtls
  GRPC_TLS_CERT_FILE: /run/secrets/tls.crt
  GRPC_TLS_KEY_FILE: /run/secrets/tls.key
  GRPC_TLS_CA_FILE: /run/secrets/ca.crt

services:
  gateway-service:
    environment:
      <<: *mtls-env
    volumes:
      - ./secrets/grpc/ca.crt:/run/secrets/ca.crt:ro
      - ./secrets/grpc/gateway-service/tls.crt:/run/secrets/tls.crt:ro
      - ./secrets/grpc/gateway-service/tls.key:/run/secrets/tls.key:ro

  identity-service:
    environment:
      <<: *mtls-env
    volumes:
      - ./secrets/grpc/ca.crt:/run/secrets/ca.crt:ro
      - ./secrets/grpc/identity-service/tls.crt:/run/secrets/tls.crt:ro
      - ./secrets/grpc/identity-service/tls.key:/run/secrets/tls.key:ro

  twofa-service:
    environment:
      <<: *mtls-env
    volumes:
      - ./secrets/grpc/ca.crt:/run/secrets/ca.crt:ro
      - ./secrets/grpc/twofa-service/tls.crt:/run/secrets/tls.crt:ro
      - ./secrets/grpc/twofa-service/tls.key:/run/secrets/tls.key:ro

  passkey-service:
    environment:
      <<: *mtls-env
    volumes:
      - ./secrets/grpc/ca.crt:/run/secrets/ca.crt:ro
      - ./secrets/grpc/passkey-service/tls.crt:/run/secrets/tls.crt:ro
      - ./secrets/grpc/passkey-service/tls.key:/run/secrets/tls.key:ro

  job-service:
    environment:
      <<: *mtls-env
    volumes:
      - ./secrets/grpc/ca.crt:/run/secrets/ca.crt:ro
      - ./secrets/grpc/job-service/tls.crt:/run/secrets/tls.crt:ro
      - ./secrets/grpc/job-service/tls.key:/run/secrets/tls.key:ro

  file-service:
    environment:
      <<: *mtls-env
      FILE_S3_USE_SSL: "true"
    volumes:
      - ./secrets/grpc/ca.crt:/run/secrets/ca.crt:ro
      - ./secrets/grpc/file-service/tls.crt:/run/secrets/tls.crt:ro
      - ./secrets/grpc/file-service/tls.key:/run/secrets/tls.key:ro

  document-api:
    environment:
      <<: *mtls-env
    volumes:
      - ./secrets/grpc/ca.crt:/run/secrets/ca.crt:ro
      - ./secrets/grpc/document-api/tls.crt:/run/secrets/tls.crt:ro
      - ./secrets/grpc/document-api/tls.key:/run/secrets/tls.key:ro

  document-worker:
    environment:
      <<: *mtls-env
    volumes:
      - ./secrets/grpc/ca.crt:/run/secrets/ca.crt:ro
      - ./secrets/grpc/document-worker/tls.crt:/run/secrets/tls.crt:ro
      - ./secrets/grpc/document-worker/tls.key:/run/secrets/tls.key:ro

  matching-service:
    environment:
      <<: *mtls-env
    volumes:
      - ./secrets/grpc/ca.crt:/run/secrets/ca.crt:ro
      - ./secrets/grpc/matching-service/tls.crt:/run/secrets/tls.crt:ro
      - ./secrets/grpc/matching-service/tls.key:/run/secrets/tls.key:ro

  brand-service:
    environment:
      <<: *mtls-env
    volumes:
      - ./secrets/grpc/ca.crt:/run/secrets/ca.crt:ro
      - ./secrets/grpc/brand-service/tls.crt:/run/secrets/tls.crt:ro
      - ./secrets/grpc/brand-service/tls.key:/run/secrets/tls.key:ro

  calculation-service:
    environment:
      <<: *mtls-env
    volumes:
      - ./secrets/grpc/ca.crt:/run/secrets/ca.crt:ro
      - ./secrets/grpc/calculation-service/tls.crt:/run/secrets/tls.crt:ro
      - ./secrets/grpc/calculation-service/tls.key:/run/secrets/tls.key:ro

  audit-service:
    environment:
      <<: *mtls-env
    volumes:
      - ./secrets/grpc/ca.crt:/run/secrets/ca.crt:ro
      - ./secrets/grpc/audit-service/tls.crt:/run/secrets/tls.crt:ro
      - ./secrets/grpc/audit-service/tls.key:/run/secrets/tls.key:ro

  postgres:
    ports: !override []
    volumes:
      - ./secrets/grpc/postgres/tls.crt:/tls/tls.crt:ro
      - ./secrets/grpc/postgres/tls.key:/tls/tls.key:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cp /tls/tls.crt /tmp/server.crt
        cp /tls/tls.key /tmp/server.key
        chown postgres:postgres /tmp/server.crt /tmp/server.key
        chmod 644 /tmp/server.crt
        chmod 600 /tmp/server.key
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tmp/server.crt -c ssl_key_file=/tmp/server.key

  redis:
    ports: !override []

  minio:
    ports: !override []
    command: server /data --console-address ":9001" --certs-dir /certs
    environment:
      MC_HOST_local: https://${S3_ACCESS_KEY:-minioadmin}:${S3_SECRET_KEY:-minioadmin}@127.0.0.1:9000
    volumes:
      - ./secrets/grpc/minio/tls.crt:/certs/public.crt:ro
      - ./secrets/grpc/minio/tls.key:/certs/private.key:ro
    healthcheck:
      test: ["CMD", "mc", "ready", "--insecure", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
