services:
  minio:
    image: mirror.gcr.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: https://${PUBLIC_HOST}:9000
      MINIO_BROWSER_REDIRECT_URL: https://${PUBLIC_HOST}:9001
    volumes:
      - minio:/data
    expose:
      - "9000"
      - "9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  mirror:
    image: mirror.gcr.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb -p local/inbound
        mc mirror --watch /inbox local/inbound
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - inbox:/inbox:ro

  inbound:
    build: .
    restart: unless-stopped
    user: "0:0"
    environment:
      INBOUND_TOKEN: ${INBOUND_TOKEN:?set INBOUND_TOKEN}
      INBOUND_ADDR: ":8787"
      INBOUND_DIR: /data
    volumes:
      - inbox:/data
    expose:
      - "8787"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      - inbound
      - minio
    ports:
      - "80:80"
      - "443:443"
      - "9000:9000"
      - "9001:9001"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  inbox:
  minio:
  caddy-data:
  caddy-config:
